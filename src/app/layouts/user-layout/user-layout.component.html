<div class="dashboard-container" [class.sidebar-open]="isSidebarOpen">
  <!-- Barre supérieure : visible uniquement sur mobile / tablette -->
  <header class="topbar">
    <button
      type="button"
      class="burger"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="isSidebarOpen"
      aria-label="Ouvrir le menu"
    >
      <i class="fa fa-bars"></i>
    </button>
    <a routerLink="/dashboard/formations" class="topbar-logo">
      <img src="assets/img/banner/tuwindi.png" alt="Tuwindi" />
    </a>
    <a routerLink="/dashboard/profil" class="topbar-avatar" aria-label="Profil">
      {{ initials }}
    </a>
  </header>

  <!-- Voile sombre derrière le menu ouvert (mobile) -->
  <div
    class="sidebar-backdrop"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a routerLink="/dashboard/formations" class="brand">
        <img src="assets/img/banner/tuwindi.png" alt="Tuwindi" />
      </a>
      <button
        type="button"
        class="close-sidebar"
        (click)="closeSidebar()"
        aria-label="Fermer le menu"
      >
        <i class="fa fa-times"></i>
      </button>
    </div>

    <div class="sidebar-user">
      <span class="avatar">{{ initials }}</span>
      <div class="user-meta">
        <strong>{{ displayName }}</strong>
        <small>Apprenant</small>
      </div>
    </div>

    <nav class="sidebar-menu" aria-label="Navigation principale">
      <a
        *ngFor="let item of menu"
        [routerLink]="item.link"
        routerLinkActive="active"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/index" class="btn-site">
        <i class="fa fa-arrow-left"></i> Retour au site
      </a>
      <button type="button" (click)="onLogout()">
        <i class="fa fa-sign-out"></i> Déconnexion
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
