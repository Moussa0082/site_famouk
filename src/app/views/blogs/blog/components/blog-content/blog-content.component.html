<section class="vl-blog-inner sp2">
  <div class="container">
    <div class="row">
      @for (blog of blogs; track $index) {
        <div class="col-lg-4 col-md-6">
          <div class="vl-single-blg-item">
            <div class="vl-blg-thumb">
              <a [routerLink]="['/blog', blog.id]">
                <img class="w-100" [src]="blog.image" [alt]="blog.title" />
              </a>
            </div>
            <div class="vl-meta">
              <ul>
                <li>
                  <a href="javascript:void(0);">
                    <img src="assets/img/icons/vl-calender-1.1.svg" alt="" />
                    {{ blog.date }}
                  </a>
                </li>
                <li>
                  <a href="javascript:void(0);">
                    <img src="assets/img/icons/vl-user-1.1.svg" alt="" />
                    {{ blog.author }}
                  </a>
                </li>
              </ul>
            </div>
            <div class="vl-blg-content">
              <h3 class="title text-truncate">
                <a [routerLink]="['/blog', blog.id]">{{ blog.title }}</a>
              </h3>
              <p class="desc text-ellipsis">{{ blog.description }}</p>
              <div class="btn-area mt-3">
                <a [routerLink]="['/blog', blog.id]" class="header-btn1 w-100">
                  Découvrir <span><i class="fa-solid fa-arrow-right" style="color: black;"></i></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Pagination -->
    <div class="row">
      <div class="col-12 m-auto">
        <div class="theme-pagination text-center mt-4">
          <ul>
            <li><a href="#"><i class="fa-solid fa-angle-left"></i></a></li>
            <li><a class="active" href="#">01</a></li>
            <li><a href="#">02</a></li>
            <li>...</li>
            <li><a href="#">12</a></li>
            <li><a href="#"><i class="fa-solid fa-angle-right"></i></a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
