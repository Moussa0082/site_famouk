<div class="vl-sidebar-area sp2">
  <div class="container">
    <div class="col-lg-8 mx-auto">
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p>Chargement des articles...</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="vl-event-content-area ml-50 mb-50" *ngFor="let blog of blogs">
        <div class="vl-large-thumb">
          <img
            [src]="getBlogImage(blog)"
            height="80%"
            width="90%"
            style="object-fit: cover; border-radius: 10px"
            [alt]="blog.titre"
          />
        </div>

        <div class="vl-blog-meta-box mt-32">
          <ul>
            <li>
              <a href="javascript:void(0);">
                <span><img src="assets/img/team/t3.jpeg" alt="" /></span>
                {{ blog.auteur }}
              </a>
            </li>
            <li>
              <a href="javascript:void(0);">
                <span class="icon">
                  <img src="assets/img/icons/vl-calender-1.1.svg" alt="" />
                </span>
                {{ blog.datePublication | date : "dd/MM/yyyy" }}
              </a>
            </li>
            <li>
              <a href="javascript:void(0);">
                <span class="icon">
                  <img src="assets/img/icons/vl-tags.svg" alt="" />
                </span>
                {{ blog.categorie?.nom || "Actualité" }}
              </a>
            </li>
          </ul>
        </div>

        <div class="vl-event-content vl-blg-content">
          <h2 class="title">{{ blog.titre }}</h2>
          <p class="para pb-16">{{ blog.description }}</p>

          <!-- <div class="text-left">
            <a
              [routerLink]="['/blog-detail', blog.id]"
              class="btn btn-link text-info p-0"
            >
              Lire la suite <i class="fas fa-arrow-right ml-2"></i>
            </a>
          </div> -->
        </div>

        <hr class="mt-5 mb-5" style="border-top: 1px solid #eee; width: 90%" />
      </div>

      <div *ngIf="!isLoading && blogs.length === 0" class="text-center">
        <p class="text-muted">Aucun article disponible pour le moment.</p>
      </div>
    </div>
  </div>
</div>
