<div class="row">
    <div class="col-md-4 col-sm-6 mb-4" *ngFor="let m of filteredModules">
      <article class="course-card">
        <div class="thumb">
          <img [src]="m.image" alt="{{m.title}}">
          <!-- <div class="thumb-overlay">
            <button class="btn-detail" (click)="openDetail(m)">Voir détails</button>
          </div> -->
        </div>
        <div class="body">
          <span class="chip">{{m.category}}</span>
          <h4>{{m.title}}</h4>
          <p class="desc">{{m.description}}</p>
          <div class="card-actions">
            <a *ngIf="m.pdf" [href]="m.pdf" download class="link">Télécharger PDF</a>
            <a *ngIf="m.video" [href]="m.video" target="_blank" class="link">Voir la vidéo</a>
          </div>
        </div>
      </article>
    </div>
  </div>
  
  <app-elearning-detail *ngIf="selected" [module]="selected" (close)="closeDetail()"></app-elearning-detail>
