   <div class="quiz-list">
    <h2 class="title">🧠 Explorez nos Quiz</h2>
  
    <div class="search-bar">
      <input type="text" placeholder="Rechercher un quiz..." />
    </div>
  
    <div class="grid">
      <div class="quiz-card" *ngFor="let q of quizzes" (click)="openDetail(q)">
        <img [src]="q.image" alt="{{q.title}}" />
        <div class="info">
          <h4>{{ q.title }}</h4>
          <p>{{ q.desc }}</p>
          <div class="meta">
            <span>⏱ {{ q.duration }} min</span>
            <span>📘 {{ q.questions }} questions</span>
          </div>
        </div>
      </div>
    </div>
  </div>
