<div class="auth-container">
  <div class="auth-card">
    <h2>Créer un compte</h2>
    <p>Rejoignez la plateforme Famoc dès aujourd'hui</p>

    <form [formGroup]="signupForm" (ngSubmit)="onRegister()">
      <div class="row">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="nom" placeholder="Ex: Diop" />
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input
            type="text"
            formControlName="prenom"
            placeholder="Ex: Moussa"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="moussa@exemple.com"
        />
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input
          type="tel"
          formControlName="telephone"
          placeholder="77 000 00 00"
        />
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          formControlName="motDePasse"
          placeholder="••••••••"
        />
      </div>

      <button type="submit" [disabled]="signupForm.invalid || loading">
        {{ loading ? "Traitement..." : "S'inscrire" }}
      </button>

      <p class="footer-text">
        Déjà un compte ? <a routerLink="/login">Connectez-vous</a>
      </p>
    </form>
  </div>
</div>
